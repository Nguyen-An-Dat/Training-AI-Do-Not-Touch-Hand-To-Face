server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — redirect mọi path về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets dài hạn
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;
}
